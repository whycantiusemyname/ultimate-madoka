<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e20">
  <meta name="description" content="Ultimate Madoka 圆神数字雕塑展。观看卡面、完整造型与背面，或在浏览器中环绕观察三维作品。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="圆环之理 · Ultimate Madoka">
  <meta property="og:description" content="从一帧卡面到立体雕塑。观赏完整造型，并自由旋转探看星空裙摆。">
  <meta property="og:url" content="https://ultimate.madoka.site/">
  <meta property="og:image" content="https://ultimate.madoka.site/assets/social.jpg?v=cycles">
  <meta name="twitter:card" content="summary_large_image">
  <title>圆环之理 · Ultimate Madoka 数字雕塑</title>
  <link rel="canonical" href="https://ultimate.madoka.site/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=cycles">
  <script type="module" src="gallery.js?v=cycles"></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到作品</a>
  <header class="masthead shell">
    <a class="wordmark" href="#top"><span class="cycle-mark" aria-hidden="true"></span><span>魔法少女小圆</span><small lang="en">Puella Magi Madoka Magica</small></a>
    <nav aria-label="展览导航">
      <a href="#viewer">三维展厅</a>
      <a href="#plates">作品图录</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero" aria-labelledby="title">
      <div class="hero-sky" aria-hidden="true"></div>
      <div class="hero-cycles" aria-hidden="true"></div>
      <div class="hero-stars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <picture class="hero-figure">
        <source media="(max-width: 650px)" srcset="assets/madoka-key-art-mobile.webp">
        <img src="assets/madoka-key-art.webp" width="1640" height="1305" alt="鹿目圆迎着暖光伸出白手套，粉色羽翼和飘散的发梢掠过星空" fetchpriority="high">
      </picture>
      <div class="hero-veil" aria-hidden="true"></div>
      <div class="hero-inner shell">
        <div class="hero-copy">
          <p class="hero-credit"><span aria-hidden="true"></span>鹿目圆 <b aria-hidden="true">/</b> 数字雕塑</p>
          <h1 id="title">圆环之理</h1>
          <div class="hero-signature"><p class="hero-name" lang="en">Ultimate Madoka</p>
            <svg class="rune-word rune-name" viewBox="0 -1 216 36" aria-hidden="true" focusable="false"><use href="assets/witch-lettering.svg#madoka"></use></svg>
          </div>
          <div class="hero-actions">
            <a class="button button-primary" href="#viewer"><span class="orbit-icon" aria-hidden="true"></span>进入三维展厅<span aria-hidden="true">↓</span></a>
            <a class="text-link" href="#plates">浏览图录<span aria-hidden="true">↓</span></a>
          </div>
        </div>
      </div>
    </section>

    <section id="viewer" class="exhibit" aria-labelledby="viewer-title">
      <div class="shell">
        <header class="section-heading">
          <div>
            <p class="eyebrow paired-label" lang="en">Sculpture<svg class="rune-word rune-sculpture" viewBox="0 -1 324 36" aria-hidden="true" focusable="false"><use href="assets/witch-lettering.svg#sculpture"></use></svg></p>
            <h2 id="viewer-title">三维展厅</h2>
          </div>
          <div class="section-aside">
            <span class="witch-inscription" aria-hidden="true"></span>
          </div>
        </header>
        <div class="viewer-frame">
          <div class="viewer-stage" id="viewer-stage" data-state="idle">
            <img class="stage-poster" src="assets/turntable-poster.webp" width="1000" height="1100" alt="" loading="lazy" decoding="async">
            <div class="viewer-guide" id="viewer-guide">
              <span class="stage-icon orbit-icon" aria-hidden="true"></span>
              <p class="stage-title">360° 环绕观赏</p>
              <p class="stage-description" id="viewer-description">选择模型版本，加载后即可旋转与放大。</p>
              <button class="button button-stage" id="load-model" type="button" hidden>加载三维模型<span aria-hidden="true">↗</span></button>
              <progress id="model-progress" aria-label="模型加载进度" max="100" hidden></progress>
              <noscript><p>启用 JavaScript 后可使用三维查看器。下方图录可直接浏览。</p></noscript>
            </div>
          </div>
          <div class="viewer-toolbar">
            <p id="viewer-controls-hint">拖动或用方向键旋转 · 滚轮、捏合或用 ＋ / − 缩放</p>
            <div class="viewer-actions" id="viewer-actions" hidden>
              <div class="viewer-controls" id="camera-actions" aria-label="三维视角控制" role="group" hidden>
                <button type="button" id="zoom-out" aria-label="缩小模型">−</button>
                <button type="button" id="zoom-in" aria-label="放大模型">+</button>
                <button type="button" id="reset-view">重置视角</button>
              </div>
              <div class="base-controls" id="base-controls" aria-label="魔法阵底座" role="group" hidden>
                <button type="button" id="toggle-pedestal" aria-pressed="false">魔法阵底座</button>
              </div>
              <div class="viewer-edition" aria-label="模型版本" role="group">
                <button type="button" data-edition="web" aria-pressed="true">高精压缩版<span aria-hidden="true" data-size="web"></span></button>
                <button type="button" data-edition="full" aria-pressed="false">无损完整版<span aria-hidden="true" data-size="full"></span></button>
              </div>
            </div>
          </div>
          <p class="sr-only" id="viewer-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section id="plates" class="plates shell" aria-labelledby="plates-title">
      <header class="section-heading">
        <div>
          <p class="eyebrow paired-label" lang="en">Gallery<svg class="rune-word rune-gallery" viewBox="0 -1 252 36" aria-hidden="true" focusable="false"><use href="assets/witch-lettering.svg#gallery"></use></svg></p>
          <h2 id="plates-title">作品图录</h2>
        </div>
      </header>
      <div class="plate-grid">
        <figure class="gallery-plate">
          <a class="plate-link" href="assets/hero.webp" aria-label="查看卡面视角原图">
            <img src="assets/hero.webp" width="815" height="1238" alt="卡面镜头中的脸、伸出的手和裙摆内衬" loading="lazy" decoding="async">
            <span class="enlarge" aria-hidden="true">↗</span>
          </a>
          <figcaption><h3>卡面视角</h3><span lang="en">Portrait</span></figcaption>
        </figure>
        <figure class="gallery-plate">
          <a class="plate-link" href="assets/full.webp" aria-label="查看完整造型原图">
            <img src="assets/full.webp" width="1400" height="1872" alt="圆神的完整造型，从展开的粉色羽翼到落入星空的深紫拖尾" loading="lazy" decoding="async">
            <span class="enlarge" aria-hidden="true">↗</span>
          </a>
          <figcaption><h3>完整造型</h3><span lang="en">Full figure</span></figcaption>
        </figure>
        <figure class="gallery-plate">
          <a class="plate-link" href="assets/reverse.webp" aria-label="查看背面造型原图">
            <img src="assets/reverse.webp" width="1400" height="1911" alt="圆神背面，粉色羽翼与长发向两旁舒展，下方是层叠的白色裙褶与紫色拖尾" loading="lazy" decoding="async">
            <span class="enlarge" aria-hidden="true">↗</span>
          </a>
          <figcaption><h3>背面造型</h3><span lang="en">Reverse</span></figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer shell">
    <p><span class="cycle-mark" aria-hidden="true"></span>《魔法少女小圆》同人数字雕塑</p>
    <div class="footer-links">
      <a class="text-link" href="https://github.com/whycantiusemyname/ultimate-madoka">GitHub<span aria-hidden="true">↗</span></a>
      <a class="text-link" href="https://github.com/whycantiusemyname/ultimate-madoka/releases/tag/v1.0.0">下载原始模型<span aria-hidden="true">↗</span></a>
      <a class="text-link" href="assets/pedestal.glb" download>下载底座 GLB<span aria-hidden="true">↓</span></a>
      <a class="text-link" href="assets/pedestal.blend" download>底座 Blender 源文件<span aria-hidden="true">↓</span></a>
      <a class="text-link" href="#top">回到顶部<span aria-hidden="true">↑</span></a>
    </div>
  </footer>
</body>
</html>
