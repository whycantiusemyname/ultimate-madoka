<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5e9e6">
  <meta name="description" content="Ultimate Madoka 圆神数字雕塑展。观看卡面、完整造型与背面，或在浏览器中环绕观察三维作品。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ultimate Madoka · 圆神数字雕塑">
  <meta property="og:description" content="从一帧卡面到立体雕塑。观赏完整造型，并自由旋转探看星空裙摆。">
  <meta property="og:image" content="assets/social.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <title>Ultimate Madoka · 圆神数字雕塑</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="gallery.js"></script>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到作品</a>
  <header class="masthead shell">
    <a class="wordmark" href="#top" lang="en"><span class="soul-gem" aria-hidden="true"></span>Ultimate Madoka</a>
    <nav aria-label="展览导航">
      <a href="#viewer">三维展厅</a>
      <a href="#plates">作品图录</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero shell" aria-labelledby="title">
      <div class="hero-copy">
        <div class="celestial" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <p class="eyebrow"><span class="rule" aria-hidden="true"></span>圆神 <span class="kicker-divider" aria-hidden="true">/</span> 数字雕塑</p>
        <h1 id="title" lang="en"><span>Ultimate</span><em>Madoka</em></h1>
        <p class="hero-description">从一帧卡面走入立体。粉色羽翼在背光中展开，层叠的礼裙托起一片星空。</p>
        <div class="hero-actions">
          <a class="button button-primary" href="#viewer"><span class="orbit-icon" aria-hidden="true"></span>进入三维展厅<span aria-hidden="true">↘</span></a>
          <a class="text-link" href="#plates">浏览图录<span aria-hidden="true">↓</span></a>
        </div>
      </div>
      <figure class="hero-plate">
        <div class="hero-image">
          <img src="assets/hero.webp" alt="圆神伸出戴着白手套的手，粉色羽翼在背光中张开，层叠裙摆下露出星空内衬" fetchpriority="high" width="815" height="1238">
          <span class="plate-corner top-left" aria-hidden="true"></span><span class="plate-corner top-right" aria-hidden="true"></span>
          <span class="plate-corner bottom-left" aria-hidden="true"></span><span class="plate-corner bottom-right" aria-hidden="true"></span>
        </div>
        <figcaption><span>卡面视角</span><span lang="en">The card portrait</span></figcaption>
      </figure>
    </section>

    <section id="viewer" class="exhibit" aria-labelledby="viewer-title">
      <div class="shell">
        <header class="section-heading">
          <div>
            <p class="eyebrow" lang="en"><span class="rule" aria-hidden="true"></span> The sculpture</p>
            <h2 id="viewer-title">三维展厅</h2>
          </div>
          <p>绕到羽翼背后，沿着裙摆看星空。</p>
        </header>
        <div class="viewer-frame">
          <div class="viewer-stage" id="viewer-stage" data-state="idle">
            <img class="stage-poster" src="assets/full.webp" width="1400" height="1872" alt="" loading="lazy" decoding="async">
            <div class="viewer-guide" id="viewer-guide">
              <span class="stage-icon orbit-icon" aria-hidden="true"></span>
              <p class="stage-title">360° 环绕观赏</p>
              <p class="stage-description" id="viewer-description">加载网页版模型，即可旋转与放大。</p>
              <button class="button button-stage" id="load-model" type="button" hidden>加载三维模型<span aria-hidden="true">↗</span></button>
              <progress id="model-progress" aria-label="模型加载进度" max="100" hidden></progress>
              <noscript><p>启用 JavaScript 后可使用三维查看器。下方图录可直接浏览。</p></noscript>
            </div>
          </div>
          <div class="viewer-toolbar">
            <p id="viewer-controls-hint">拖动或用方向键旋转 · 滚轮、捏合或用 ＋ / − 缩放</p>
            <div class="viewer-actions" id="viewer-actions" hidden>
              <div class="viewer-controls" aria-label="三维视角控制" role="group">
                <button type="button" id="zoom-out" aria-label="缩小模型">−</button>
                <button type="button" id="zoom-in" aria-label="放大模型">+</button>
                <button type="button" id="reset-view">重置视角</button>
              </div>
              <div class="viewer-edition" aria-label="模型版本" role="group">
                <button type="button" data-edition="web" aria-pressed="true">网页版<span aria-hidden="true" data-size="web"></span></button>
                <button type="button" data-edition="full" aria-pressed="false">完整版<span aria-hidden="true" data-size="full"></span></button>
              </div>
            </div>
          </div>
          <p class="sr-only" id="viewer-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section id="plates" class="plates shell" aria-labelledby="plates-title">
      <header class="section-heading">
        <div>
          <p class="eyebrow" lang="en"><span class="rule" aria-hidden="true"></span> Gallery plates</p>
          <h2 id="plates-title">作品图录</h2>
        </div>
        <p>从正面与背面，细看同一件雕塑。</p>
      </header>
      <div class="plate-grid">
        <figure class="gallery-plate">
          <a class="plate-link" href="assets/full.webp" aria-label="查看完整造型原图">
            <img src="assets/full.webp" width="1400" height="1872" alt="圆神的完整造型，从展开的粉色羽翼到落入星空的深紫拖尾" loading="lazy" decoding="async">
            <span class="enlarge" aria-hidden="true">↗</span>
          </a>
          <figcaption><div><h3>完整造型</h3><p>星空内衬延伸至裙尾。</p></div><span lang="en">Front view</span></figcaption>
        </figure>
        <figure class="gallery-plate">
          <a class="plate-link" href="assets/reverse.webp" aria-label="查看背面造型原图">
            <img src="assets/reverse.webp" width="1400" height="1911" alt="圆神背面，粉色羽翼与长发向两旁舒展，下方是层叠的白色裙褶与紫色拖尾" loading="lazy" decoding="async">
            <span class="enlarge" aria-hidden="true">↗</span>
          </a>
          <figcaption><div><h3>背面造型</h3><p>分束长发穿过舒展的粉色羽翼。</p></div><span lang="en">Reverse view</span></figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer shell">
    <p><span class="soul-gem" aria-hidden="true"></span>《魔法少女小圆》同人数字雕塑</p>
    <div class="footer-links">
      <a class="text-link" href="https://github.com/whycantiusemyname/ultimate-madoka/releases/tag/v1.0.0">下载原始模型<span aria-hidden="true">↗</span></a>
      <a class="text-link" href="#top">回到顶部<span aria-hidden="true">↑</span></a>
    </div>
  </footer>
</body>
</html>
